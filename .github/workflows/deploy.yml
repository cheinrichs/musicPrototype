name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Flutter iOS and Upload to TestFlight
    # GitHub-hosted macOS runner — comes with Xcode preinstalled, no self-hosted
    # runner needed (unlike SongStone/Unity, Flutter has no Editor/license
    # dependency). Free on public repos, billed at the macOS minute rate on
    # private ones — see DEPLOYMENT.md.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS (unsigned)
        # --build-number is set from the GitHub Actions run number so every
        # upload is unique and strictly increasing, as TestFlight requires.
        # pubspec.yaml's version+build number is otherwise static and would
        # cause every deploy after the first to be rejected.
        #
        # --dart-define=COMMIT_SHA embeds the exact commit this binary was
        # built from into "Report this round" (see lib/app/build_info.dart)
        # — deliberately NOT DEV_MODE=true: TestFlight and a later App
        # Store submission share this exact archive, so dev tools have to
        # stay off at build time and get switched on at runtime instead,
        # only for non-App-Store installs — see lib/app/config.dart and
        # ios/Runner/AppDelegate.swift's isInternalDistribution().
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=COMMIT_SHA=${{ github.sha }}

      - name: Decode certificate and profile
        run: |
          echo "${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}" | base64 --decode > /tmp/distribution.p12
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > /tmp/distribution.mobileprovision

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        working-directory: ios
        run: bundle exec fastlane beta
